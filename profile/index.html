<!DOCTYPE html>

    <!-- Helvetica Neue ME -->

    <link rel="stylesheet" href="../css/style.css">

<body class="profile-page">

                <div class="profile-social">

                    </a>

                    <a href="https://www.tiktok.com/@joelllangga" target="_blank" rel="noopener noreferrer">
                        TikTok
                    </a>
                    
                </div>

            </div>


            <!-- Mobile Hamburger -->

            <button
                class="profile-menu-button"
                id="profileMenuButton"
                aria-label="Open navigation menu"
                aria-expanded="false"
            >

                <span></span>
                <span></span>

            <div class="profile-marquee">

        ========================================== -->

                class="profile-drawer-backdrop"
                id="profileDrawerBackdrop"
